{% extends "base.html" %}

{% block title %}Create Account — AssureX Claim Engine{% endblock %}

{% block content %}
<div class="auth-card">
    <div class="panel">
        <div class="panel-header" style="justify-content: center; padding: 22px 28px;">
            <h2 class="panel-title" style="font-size: 15px;">
                <svg class="icon" style="color: var(--primary);" aria-hidden="true"><use href="/static/icons.svg#fa-user-plus"></use></svg>
                Create account
            </h2>
        </div>
        <div class="panel-body" style="padding: 28px;">
            {% if error %}
            <div class="flash flash-error" role="alert">
                <svg class="icon" aria-hidden="true"><use href="/static/icons.svg#fa-triangle-exclamation"></use></svg>
                <span>{{ error }}</span>
            </div>
            {% endif %}

            <form action="/register" method="POST">
                <div class="form-group" style="margin-bottom: 14px;">
                    <label class="form-label" for="reg-name">Full name</label>
                    <input id="reg-name" type="text" name="full_name" class="form-input"
                           placeholder="e.g. Jane Doe" value="{{ full_name or '' }}" required autofocus>
                </div>

                <div class="form-group" style="margin-bottom: 14px;">
                    <label class="form-label" for="reg-email">Email address</label>
                    <input id="reg-email" type="email" name="email" class="form-input"
                           placeholder="e.g. jane@example.com" value="{{ email or '' }}" required>
                </div>

                <div class="form-group" style="margin-bottom: 14px;">
                    <label class="form-label" for="reg-password">Password</label>
                    <input id="reg-password" type="password" name="password" class="form-input"
                           placeholder="Minimum 6 characters" minlength="6" required>
                </div>

                <div class="form-group" style="margin-bottom: 24px;">
                    <label class="form-label" for="reg-role">Account role</label>
                    <select id="reg-role" name="role" class="form-select" required>
                        <option value="customer" {% if role == 'customer' %}selected{% endif %}>Customer (Product owner &amp; claimant)</option>
                        <option value="service_center" {% if role == 'service_center' %}selected{% endif %}>Authorized service center staff</option>
                    </select>
                    <span style="font-size: 11px; color: var(--text-muted); margin-top: 3px;">Reviewer and Admin roles are assigned internally.</span>
                </div>

                <button type="submit" class="btn btn-primary" style="width: 100%; min-height: 42px; font-size: 13.5px;">
                    <svg class="icon" aria-hidden="true"><use href="/static/icons.svg#fa-user-check"></use></svg>
                    Create account
                </button>
            </form>

            <div style="margin-top: 20px; padding-top: 16px; border-top: 1px solid var(--border); font-size: 12.5px; color: var(--text-sub); text-align: center;">
                Already have an account? <a href="/login" class="link">Sign in</a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
