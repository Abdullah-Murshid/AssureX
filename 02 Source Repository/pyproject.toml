[project]
name = "assurex-claim-engine"
version = "2.0.1"
description = "Techwiz warranty claim evaluation with tabular ML and Google Teachable Machine"
requires-python = ">=3.11,<3.12"
dependencies = [
    "django>=5.2.18",
    "django-ninja>=1.7.1",
    "fastapi>=0.100.0",
    "httpx>=0.24.0",
    "itsdangerous>=2.1.2",
    "jinja2>=3.1.2",
    "joblib>=1.3.0",
    "lightgbm>=4.0.0",
    "numpy>=1.24.0",
    "pandas>=2.0.0",
    "pillow>=10.0.0",
    "pymupdf>=1.23.0",
    "pytest>=7.4.0",
    "python-multipart>=0.0.6",
    "pyyaml>=6.0",
    "scikit-learn>=1.3.0",
    "sqlalchemy>=2.0.0",
    "tensorflow==2.21.0",
    "tf-keras>=2.21.0",
    "uvicorn>=0.22.0",
    "xgboost>=2.0.0",
]

[tool.pytest.ini_options]
pythonpath = ["src", ".", "backend"]
testpaths = ["tests", "tests_api"]
